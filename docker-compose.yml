services:
  nanolabshub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nanolabshub
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DOCKER_HOST_MODE=internal
      - SERVER_HOST=host.docker.internal
      - SERVER_PORT=2207
      - SERVER_USER=augusto
      - ADMIN_USER=${ADMIN_USER:-augusto}
      - ADMIN_PASS=${ADMIN_PASS:-Qap.1029Qap.1029}
      - HUB_MASTER_KEY=${HUB_MASTER_KEY:-nanolabs_governance_supreme_2026}
      - DATA_DIR=/app/data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/apps:/opt/apps
      - /opt/backups:/opt/backups
      - /opt/apps/nanolabshub/data:/app/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
