services:
  nanolabshub:
    environment:
      HUB_BACKUPS_ENABLED: ${HUB_BACKUPS_ENABLED:-false}
      HUB_BACKUP_SCHEDULER_KEY: ${HUB_BACKUP_SCHEDULER_KEY:-}
  nanolabshub-backup-scheduler:
    image: nanolabshub-nanolabshub:latest
    container_name: nanolabshub-backup-scheduler
    command: ["node", "/app/scripts/backup-scheduler.cjs"]
    restart: unless-stopped
    # Worker does not expose HTTP /api/health; override inherited web healthcheck.
    healthcheck:
      test: ["CMD", "node", "/app/scripts/backup-scheduler-health.cjs"]
      interval: 1m
      timeout: 5s
      start_period: 25m
      retries: 3
    environment:
      HUB_BACKUP_SCHEDULER_KEY: ${HUB_BACKUP_SCHEDULER_KEY:-}
    networks:
      - proxy
networks:
  proxy:
    external: true
