name: Validate UI redesign

on:
  push:
    branches:
      - design/governance-hub-redesign-0.1.0
  pull_request:
    branches:
      - 0.1.0

jobs:
  isolated-sql-restore:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch official fixture images
        run: |
          docker pull mariadb:11.8.9
          docker pull postgres:16-alpine
          docker pull postgres:17-alpine
      - name: Native dump and restore, exact counts and invalid SQL rejection
        env:
          HUB_BACKUPS_ENABLED: "true"
        run: node scripts/restore-sandbox-smoke.cjs
  typecheck-build-and-visual-smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Selective SaaS read-only integration tests
        run: node --test scripts/saas-bridge.test.cjs scripts/saas-management.test.cjs

      - name: Backup engine safety tests
        run: node --test scripts/backup-engine.test.cjs scripts/job-store.test.cjs scripts/backup-runner.test.cjs
      - name: Authentication, operations and truthfulness regressions
        run: node --test scripts/audit-security.test.cjs scripts/identity.test.cjs scripts/route-coverage.test.cjs
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Scheduler heartbeat healthcheck tests
        run: node --test scripts/backup-scheduler-health.test.cjs

      - name: Isolated recovery validation tests
        run: node --test scripts/recovery-engine.test.cjs scripts/restore-evidence.test.cjs scripts/restore-sandbox.test.cjs scripts/recovery-runner.test.cjs scripts/backup-import.test.cjs

      - name: Production build
        run: npm run build

      - name: Install screenshot test browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated UI test server
        env:
          ADMIN_USER: ci_smoke
          ADMIN_PASS: ci_smoke_password
          HUB_MASTER_KEY: ci_smoke_not_for_production_only
          HUB_PUBLIC_ORIGIN: http://127.0.0.1:3005
          DATA_DIR: ${{ runner.temp }}/nanohub-ui-data
          HUB_BACKUPS_ENABLED: "true"
        run: |
          nohup npm run start > /tmp/nanolabs-ui-smoke-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3005/api/health >/dev/null; then
              echo "UI test server ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/nanolabs-ui-smoke-server.log
          exit 1

      - name: Desktop and mobile smoke screenshots
        env:
          UI_BASE_URL: http://127.0.0.1:3005
        run: node scripts/ui-smoke.mjs

      - name: Desktop and mobile SaaS management workflows
        env:
          UI_BASE_URL: http://127.0.0.1:3005
        run: node scripts/management-ui-smoke.mjs

      - name: Real isolated identity and authorization APIs
        env:
          UI_BASE_URL: http://127.0.0.1:3005
          UI_ADMIN_USER: ci_smoke
          UI_ADMIN_PASS: ci_smoke_password
          UI_DATA_DIR: ${{ runner.temp }}/nanohub-ui-data
        run: node scripts/identity-api-smoke.mjs

      - name: Attach screenshot fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-ui-screenshots
          path: ui-screenshots/
          if-no-files-found: ignore
          retention-days: 7

