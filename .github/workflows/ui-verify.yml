name: Validate UI redesign

on:
  push:
    branches:
      - design/governance-hub-redesign-0.1.0
  pull_request:
    branches:
      - 0.1.0

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
